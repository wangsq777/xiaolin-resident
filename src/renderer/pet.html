<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';">
    <title>小林驻留中 · 桌宠 BGM</title>
    <link rel="stylesheet" href="./pet.css">
    <script src="./pet.js" defer></script>
  </head>
  <body>
    <main id="petShell" class="pet-shell idle" title="拖动可移动；右键打开关怀中心或退出">
      <div id="petCharacter" class="pet-character" role="img" aria-label="像素风小林">
        <img src="./assets/character-states/default.png" alt="" draggable="false">
      </div>

      <section class="song-bubble" aria-label="状态与控制">
        <div id="songCopy" class="song-copy" title="双击打开关怀中心">
          <p id="petStatus">在这里陪你</p>
          <h1 id="petTrackTitle">小林驻留中</h1>
          <span id="petTrackArtist">右键打开关怀中心</span>
        </div>

        <div id="reminderBubble" class="reminder-bubble" hidden>
          <p id="reminderMessage" class="reminder-message">忙归忙，先喝一点水。</p>
          <div class="reminder-actions">
            <button id="reminderComplete" class="reminder-action primary" type="button">喝过了</button>
            <button id="reminderSnooze" class="reminder-action" type="button">10 分钟后</button>
            <button id="reminderSkip" class="reminder-action" type="button">今天不再</button>
          </div>
        </div>

        <div id="bgmControls" class="pet-controls" aria-label="播放控制" hidden>
          <button id="petPreviousButton" type="button" aria-label="上一首" disabled>⏮</button>
          <button id="petPlayPauseButton" class="pet-primary-control" type="button" aria-label="播放或暂停" disabled>▶</button>
          <button id="petNextButton" type="button" aria-label="下一首" disabled>⏭</button>
        </div>
      </section>
    </main>
  </body>
</html>
