<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' xiaolin-bgm:;"
    >
    <title>小林驻留中 · 本地 BGM</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./local-bgm-controller.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL BGM · DESKTOP COMPANION</p>
          <h1>小林驻留中</h1>
        </div>

        <div class="topbar-actions">
          <div id="libraryBadge" class="status-badge pending">
            <span class="status-dot"></span>
            <span id="libraryBadgeText">正在扫描 BGM</span>
          </div>
        </div>
      </header>

      <section class="hero-grid">
        <section class="character-stage" aria-label="Q 版小林动画区域">
          <div id="musicNotes" class="music-notes" aria-hidden="true">
            <span>♪</span><span>♫</span><span>♩</span>
          </div>

          <div id="chibi" class="chibi pixel-chibi idle" role="img" aria-label="像素风小林安静等待 BGM">
            <img src="./assets/chibi-lam-pixel.png" alt="" draggable="false">
          </div>

          <div id="characterSpeech" class="speech">把歌放进 BGM 文件夹，我就有东西唱了。</div>
        </section>

        <section class="player-column">
          <article class="glass-card now-playing-card">
            <div id="artwork" class="artwork-placeholder" aria-label="本地 BGM">♪</div>
            <div class="track-copy">
              <p id="playerStatus" class="eyebrow">等待 BGM</p>
              <h2 id="trackTitle">还没有播放歌曲</h2>
              <p id="trackArtist">将音频放进项目的 BGM 文件夹</p>
            </div>

            <div class="player-controls">
              <button id="previousButton" type="button" aria-label="上一首" disabled>⏮</button>
              <button id="playPauseButton" class="primary-control" type="button" aria-label="播放或暂停" disabled>▶</button>
              <button id="nextButton" type="button" aria-label="下一首" disabled>⏭</button>
            </div>
          </article>

          <article class="glass-card local-library-card">
            <header class="library-toolbar">
              <div>
                <p class="eyebrow">本地 BGM 文件夹</p>
                <h2 id="libraryTitle">等待扫描</h2>
                <p id="bgmFolderPath" class="library-path"></p>
              </div>
              <div class="library-actions">
                <button id="openBgmFolderButton" class="quiet-button" type="button">打开 BGM 文件夹</button>
                <button id="rescanBgmButton" class="primary-button" type="button">重新扫描</button>
              </div>
            </header>

            <div id="emptyLibrary" class="empty-library">
              <span aria-hidden="true">♫</span>
              <h3>BGM 文件夹还没有歌曲</h3>
              <p>放入 MP3、M4A、AAC、WAV、FLAC、OGG 或 OPUS 文件。音频只在本机播放，不需要任何开发者会员。</p>
              <small>推荐文件名：林家谦 - 歌名.mp3</small>
            </div>

            <div id="bgmLibrary" class="local-track-list" aria-live="polite"></div>
          </article>

          <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>
